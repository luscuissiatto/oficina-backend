apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina
  template:
    metadata:
      labels:
        app: oficina
    spec:
      containers:
        - name: oficina-app
          image: oficina-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-service:5432/oficina_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: postgres-configmap
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oficina-secret
                  key: jwt-secret
            - name: SPRING_MAIL_HOST
              value: mailhog-service
            - name: SPRING_MAIL_PORT
              value: "1025"
            - name: APP_ADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-secret
                  key: admin-password