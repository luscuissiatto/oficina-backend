spring.application.name=oficina-mecanica

# Segredos: os padrões abaixo servem só para desenvolvimento local.
# Em qualquer outro ambiente, defina JWT_SECRET e APP_ADMIN_DEFAULT_PASSWORD.
api.security.token.secret=${JWT_SECRET:minha-chave-secreta-super-segura}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
app.data.initialize=true
app.admin.default-password=${APP_ADMIN_DEFAULT_PASSWORD:password}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE