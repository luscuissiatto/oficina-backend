# Nome da sua pipeline
name: Oficina CI/CD Pipeline

# Gatilho: push para a branch 'main'
on:
  push:
    branches: [ "main" ]

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    # Adicionamos permissões para o job poder escrever no GitHub Packages
    permissions:
      contents: read
      packages: write

    steps:
      # --- Passos que você já tem ---
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run tests with Maven
        run: mvn test

      # --- NOVOS PASSOS ADICIONADOS ABAIXO ---

      # Passo 4: Login no GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      # Passo 5: Construir e enviar a imagem Docker para o GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/oficina-app:${{ github.sha }}