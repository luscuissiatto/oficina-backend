# Nome da sua pipeline, que aparecerá na aba "Actions" do GitHub
name: Oficina CI/CD Pipeline

# Define o gatilho (trigger) da pipeline: um push para a branch 'main'
on:
  push:
    branches: [ "main" ]

# Define os "trabalhos" (jobs) que a pipeline irá executar
jobs:
  # Nosso primeiro e único job por enquanto: construir, testar e enviar a imagem
  build-test-and-push:
    # A pipeline rodará em uma máquina virtual Linux (Ubuntu) fornecida pelo GitHub
    runs-on: ubuntu-latest

    # Define a sequência de passos (steps) a serem executados
    steps:
      # Passo 1: Faz o checkout do seu código do repositório para a máquina virtual
      - name: Checkout repository
        uses: actions/checkout@v4

      # Passo 2: Configura o ambiente Java (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Passo 3: Executa os testes com Maven
      - name: Run tests with Maven
        run: mvn test